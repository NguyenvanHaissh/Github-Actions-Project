name: Build and Push Docker Image with Jib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Cấu hình JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Đăng nhập vào Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Build và Push bằng lệnh mvn tiêu chuẩn (Không cần mvnw nữa)
    - name: Build and Push with Jib
      working-directory: ./devops-service
      run: mvn compile jib:build -Dimage=nguyenvanhai2005/devops-service:latest
