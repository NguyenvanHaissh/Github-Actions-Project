name: Build, Security Scan and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Biên dịch và kiểm tra Code Java
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile with Maven
        working-directory: ./devops-service
        run: mvn compile

  # JOB 2: Quét lỗ hổng bảo mật & Lộ secret (Chạy sau khi Compile thành công)
  security-check:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Quét lộ mật khẩu/token bằng Gitleaks Action chuẩn
      - name: Gitleaks Code Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Quét lỗ hổng mã nguồn bằng Trivy Action
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './devops-service'
          format: 'table'

  # JOB 3: Build Docker Image bằng Jib và Push lên Docker Hub (Chạy sau khi đã quét bảo mật xong)
  build-and-push:
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push with Jib
        working-directory: ./devops-service
        run: mvn compile jib:build -Dimage=nguyenvanhai2005/devops-service:latest
