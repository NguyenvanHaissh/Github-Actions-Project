name: CICD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn từ repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Cấu hình JDK 21 (hoặc version Java dự án của bạn)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Đăng nhập vào Docker Hub để Jib có quyền push Image
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Phân quyền chạy cho mvnw
    - name: Make mvnw executable
      run: chmod +x devops-service/mvnw

    # 5. Build và Push Image lên Docker Hub bằng Jib
    - name: Build and Push with Jib
      working-directory: ./devops-service
      run: ./mvnw compile jib:build -Dimage=nguyenvanhai2005/devops-service:latest
